<h1 class="text-center">Register</h1>
<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="container card bg-light mb-3">
    <div class="mb-3">
        <label for="username" class="form-label">Username:</label>
        <input type="text" name="username" id="username" formControlName="username" class="form-control">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input type="password" name="password" id="password" formControlName="password" class="form-control">
    </div>
    <div class="mb-3">
        <label for="name" class="form-label">Full Name:</label>
        <input type="text" name="name" id="name" formControlName="name" class="form-control">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" name="email" id="email" formControlName="email" class="form-control">
    </div>
    <div class="mb-3">
        <label for="role" class="form-label">Role:</label>
        <select name="role" id="role" formControlName="role" class="form-select">
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary mb-3">Create User</button>
    <a [routerLink]="['/auth/login']" class="mb-3 text-center nav-link text-primary"><b>Login</b></a>
</form>
<div *ngIf="errorMessage" class="container card bg-light">
    <p class="text-center text-danger">{{errorMessage}}</p>
</div>
