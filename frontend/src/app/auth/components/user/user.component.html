<h1 class="text-center mb-3 mt-5">Register</h1>
<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="container-sm card bg-light mb-3 p-3 w-50">
    <div class="mb-3 mt-3">
        <label for="username" class="form-label"><b>Username:</b></label>
        <input type="text" name="username" id="username" formControlName="username" class="form-control">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label"><b>Password:</b></label>
        <input type="password" name="password" id="password" formControlName="password" class="form-control">
    </div>
    <div class="mb-3">
        <label for="name" class="form-label"><b>Full Name:</b></label>
        <input type="text" name="name" id="name" formControlName="name" class="form-control">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label"><b>Email:</b></label>
        <input type="email" name="email" id="email" formControlName="email" class="form-control">
    </div>
    <div class="mb-3">
        <label for="role" class="form-label"><b>Role:</b></label>
        <select name="role" id="role" formControlName="role" class="form-select">
            <option value="USER">User</option>
            <option value="ADMIN">Admin</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary mb-3">Create User</button>
    <a [routerLink]="['/auth/login']" class="mb-3 text-center nav-link text-primary"><b>Login</b></a>
</form>
<div *ngIf="errorMessage" class="container-sm card bg-danger-subtle">
    <p class="text-center text-danger fw-bold p-3">{{errorMessage}}</p>
</div>
