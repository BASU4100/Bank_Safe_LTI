<form [formGroup]="accountForm" (ngSubmit)="onSubmit()" class="container shadow card bg-light mt-5 mb-3 w-50">
    <h3 class="text-center m-3">Create Account</h3>
    <div class="mb-3">
        <label for="customer" class="form-label"><b>Customer:</b></label>
        <select name="customer" id="customer" formControlName="customer" class="form-control">
            <ng-container *ngFor="let customer of customers">
                <option *ngIf="customer.role === 'USER'" [ngValue]="customer">{{customer.name}}</option>
            </ng-container>
        </select>
        <div *ngIf="accountForm.get('customer')?.touched" class="container">
            <small *ngIf="accountForm.get('customer')?.invalid" class="text-danger">Customer is required.</small>
        </div>
    </div>
    
    <div class="mb-3">
        <label for="balance" class="form-label"><b>Balance:</b></label>
        <input type="number" name="balance" id="balance" formControlName="balance" class="form-control">
        <div *ngIf="accountForm.get('balance')?.touched" class="container">
            <small *ngIf="accountForm.get('balance')?.invalid" class="text-danger">Balance cannot be negative or empty.</small>
        </div>
    </div>

    <button type="submit" [disabled]="accountForm.invalid" class="btn btn-primary mb-3 form-action">Create Account</button>
    <a class="form-action nav-link text-primary text-center mb-3" [routerLink]="['/bank']"><b>Dashboard</b></a>
</form>
<p *ngIf="isFormSubmitted" class="container card p-3 w-50 fw-50 text-center shadow" [class]="successMessage ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'">{{!!successMessage ? successMessage: errorMessage}}</p>
